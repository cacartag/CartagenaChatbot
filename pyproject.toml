[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cartagena, Christopher A A1C USAF (USA)", email = "christopher.cartagena.2@us.af.mil" }
]
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "ddgs>=9.8.0",
    "dotenv",
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "rich>=15.0.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


# Tool configuration

[tool.pytest.ini_options]
pythonpaths = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle errors, I = import sorting,
# B = common bug patterns, UP = modernize old syntax
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]











